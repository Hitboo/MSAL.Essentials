name: Dependency check

# Checks the libraries bundled in src/lib, which Dependabot can't see because they are plain files:
#   1. known vulnerabilities in the exact versions that are shipped (NuGet audit)
#   2. a newer MSAL.NET release
# Runs every Monday on the default branch, and on demand (Actions > Dependency check > Run workflow).
#
# - A vulnerability of severity Moderate or higher (or an audit that could not run) fails the run,
#   which also notifies you. Lower findings are shown as warnings.
# - A newer MSAL.NET opens one issue with the label "msal-update". The issue is updated when an even
#   newer version appears and closed when the bundled version is up to date.
# Nothing in the repository is changed. Updating is done with build/Update-MsalLibDependencies.ps1.

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:

# Least privilege by default. The job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: dependency-check
  cancel-in-progress: false

jobs:
  check:
    name: Bundled libraries
    runs-on: windows-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write # to open, update and close the "msal-update" issue

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the bundled libraries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Gh {
              param([string[]]$Arguments)
              $output = & gh @Arguments
              if ($LASTEXITCODE -ne 0) {
                  throw ('gh {0} failed.' -f ($Arguments -join ' '))
              }
              $output
          }

          $result = ./build/Test-MsalLibDependencies.ps1

          #region Summary
          $lines = New-Object -TypeName 'System.Collections.Generic.List[string]'
          $lines.Add('## Bundled libraries')
          $lines.Add('')
          $lines.Add(('{0}: bundled **{1}**, latest stable on nuget.org **{2}**.' -f $result.PackageId, $result.BundledVersion, $result.LatestVersion))
          $lines.Add('')

          if ($result.UpdateAvailable) {
              $lines.Add('A newer version is available.')
          }
          else {
              $lines.Add('The bundled version is the latest.')
          }
          $lines.Add('')

          if ($result.Findings.Count -eq 0) {
              $lines.Add('No known vulnerabilities in the shipped libraries (NuGet audit, transitive packages included).')
          }
          else {
              $lines.Add('| Target | Severity | Finding |')
              $lines.Add('|---|---|---|')
              foreach ($finding in $result.Findings) {
                  $lines.Add(('| {0} | {1} | {2} |' -f $finding.Target, $finding.Severity, ($finding.Message -replace '\|', '\|')))

                  $level = if ($result.BlockingFindings -contains $finding) { 'error' } else { 'warning' }
                  Write-Host ('::{0}::{1} [{2}] {3}' -f $level, $finding.Target, $finding.Severity, $finding.Message)
              }
          }

          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          #endregion Summary

          #region Issue for a newer MSAL.NET
          $repository = $env:GITHUB_REPOSITORY
          $openIssues = @(Invoke-Gh -Arguments 'issue', 'list', '--repo', $repository, '--state', 'open', '--label', 'msal-update', '--json', 'number,title' | ConvertFrom-Json)

          if ($result.UpdateAvailable) {
              $title    = 'Update the bundled MSAL.NET to {0}' -f $result.LatestVersion
              $bodyPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'msal-update-issue.md'

              $body = @(
                  ('A newer {0} is available: **{1}** (bundled: {2}).' -f $result.PackageId, $result.LatestVersion, $result.BundledVersion)
                  ''
                  'To update:'
                  ''
                  '1. Create a branch from `develop`.'
                  '2. Run `. ./build/Update-MsalLibDependencies.ps1` and then `Update-MsalLibDependencies`. It runs the vulnerability and signature checks.'
                  '3. Update `THIRD-PARTY-NOTICES.md` if the set of libraries changed, add a CHANGELOG entry and bump the module version.'
                  '4. Run the tests on both PowerShell editions and open a pull request into `develop`.'
                  ''
                  'This issue is maintained by the "Dependency check" workflow.'
              ) -join "`n"
              Set-Content -Path $bodyPath -Value $body -Encoding utf8

              Invoke-Gh -Arguments 'label', 'create', 'msal-update', '--repo', $repository, '--description', 'A newer MSAL.NET version is available', '--color', '0E8A16', '--force' | Out-Null

              if ($openIssues.Count -eq 0) {
                  Invoke-Gh -Arguments 'issue', 'create', '--repo', $repository, '--title', $title, '--label', 'msal-update', '--body-file', $bodyPath | Out-Null
              }
              elseif ($openIssues[0].title -ne $title) {
                  Invoke-Gh -Arguments 'issue', 'edit', ([string]$openIssues[0].number), '--repo', $repository, '--title', $title, '--body-file', $bodyPath | Out-Null
              }
          }
          else {
              foreach ($issue in $openIssues) {
                  Invoke-Gh -Arguments 'issue', 'close', ([string]$issue.number), '--repo', $repository, '--comment', 'The bundled version is up to date.' | Out-Null
              }
          }
          #endregion Issue for a newer MSAL.NET

          #region Fail on vulnerabilities
          if ($result.BlockingFindings.Count -gt 0) {
              throw ('{0} blocking finding(s) in the bundled libraries. See the job summary.' -f $result.BlockingFindings.Count)
          }
          #endregion Fail on vulnerabilities