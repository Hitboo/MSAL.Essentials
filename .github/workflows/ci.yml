name: CI

# CI only TESTS and checks the branch rules. It never builds, packages or publishes
# anything and it uses no secrets. Building and releasing belongs in a separate
# workflow that runs for version tags only.
#
# The integration tests (tests/3-integration) are NOT run here: they need an
# interactive sign-in, and no credentials are stored in this repository.

on:
  # Every branch except main: tests run on each push, so a feature branch is tested
  # before (and without) a pull request. develop is included on purpose: the maintainer
  # may push to it directly, and those pushes should be tested too.
  # main is left out: it never receives direct pushes, only a merged pull request from
  # develop, and that pull request has already been tested.
  push:
    branches-ignore:
      - main

  # Pull requests into the protected branches. These runs test the merge result.
  # Their jobs are the status checks to require in the branch rules:
  #   "Tests (Windows PowerShell 5.1)", "Tests (PowerShell 7)" and, for main only, "Branch policy"
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

# Least privilege: the tests only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-powershell-51:
    name: "Tests (Windows PowerShell 5.1)${{ github.event_name == 'push' && ' - branch' || '' }}"
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # To pin this action to a commit instead of a tag, copy the full commit SHA of the
      # release from https://github.com/actions/checkout/releases and write it like this:
      #   uses: actions/checkout@<full commit SHA> # v7.x.y
      # Dependabot (see dependabot.yml) keeps pinned actions up to date.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # the tests never push, so don't leave the token in .git/config

      - name: Show the PowerShell version
        shell: powershell
        run: $PSVersionTable | Out-String

      - name: Build tests (module files, libraries, import)
        shell: powershell
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/1-build

      - name: Unit tests (simulated sign-in)
        shell: powershell
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/2-unit

  test-powershell-7:
    name: "Tests (PowerShell 7)${{ github.event_name == 'push' && ' - branch' || '' }}"
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # Pin the action the same way as in the first job.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false # the tests never push, so don't leave the token in .git/config

      - name: Show the PowerShell version
        shell: pwsh
        run: $PSVersionTable | Out-String

      - name: Build tests (module files, libraries, import)
        shell: pwsh
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/1-build

      - name: Unit tests (simulated sign-in)
        shell: pwsh
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/2-unit

  # Enforces the branching model: main only receives a pull request from develop of this
  # repository. GitHub rulesets can't restrict the source branch of a pull request, so this
  # check does it. Require it in the ruleset of main only.
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Only develop may be merged into main
        env:
          # Branch names are chosen by whoever opens the pull request. They are passed in
          # as environment variables and never pasted into the script text.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ] || [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Only develop may be merged into main. Open the pull request against develop instead."
            exit 1
          fi
          echo "OK: develop -> main"