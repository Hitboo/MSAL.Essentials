name: Release

# The only workflow that builds anything. It runs when a version tag (v1.0.0, v1.1.0-beta1, ...)
# is pushed. Only the maintainer can create those tags (tag ruleset).
#
# Rehearsal: Actions > Release > Run workflow, on develop or main. It runs the tests and builds
# the package, but creates no release and publishes nothing.
#
# Order: tests -> package -> GitHub release -> PowerShell Gallery. The Gallery step comes last
# because a published version can't be deleted from the Gallery, only unlisted.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

# Never run two releases at the same time, and never cancel one that is running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One test job per PowerShell edition, started directly in that edition's shell, exactly like ci.yml.
  # (Start-Test.ps1 -AllEditions from a PowerShell 7 step makes the Windows PowerShell child inherit
  # PowerShell 7's PSModulePath, which breaks the Pester installation in the child.)
  test-powershell-51:
    name: Tests (Windows PowerShell 5.1)
    # A manual run is only allowed on the protected branches.
    if: github.event_name == 'push' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show the PowerShell version
        shell: powershell
        run: $PSVersionTable | Out-String

      - name: Build tests (module files, libraries, import)
        shell: powershell
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/1-build

      - name: Unit tests (simulated sign-in)
        shell: powershell
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/2-unit

  test-powershell-7:
    name: Tests (PowerShell 7)
    if: github.event_name == 'push' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show the PowerShell version
        shell: pwsh
        run: $PSVersionTable | Out-String

      - name: Build tests (module files, libraries, import)
        shell: pwsh
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/1-build

      - name: Unit tests (simulated sign-in)
        shell: pwsh
        run: ./tests/Start-Test.ps1 -TestsPath ./tests/2-unit

  package:
    name: Build the module package
    needs: [test-powershell-51, test-powershell-7]
    runs-on: windows-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write     # needed to sign the build provenance attestation
      attestations: write # needed to store the attestation

    outputs:
      version: ${{ steps.build.outputs.version }}
      prerelease: ${{ steps.build.outputs.prerelease }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, to check that the tag is on main
          persist-credentials: false

      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw ('The tag {0} is not on main. Releases are only made from main.' -f $env:GITHUB_REF_NAME)
          }

      - name: Build the module package
        id: build
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $parameters = @{}
          if ($env:REF_TYPE -eq 'tag') {
            $parameters['Tag'] = $env:REF_NAME
          }

          $result = ./build/Build-Module.ps1 @parameters

          'version={0}'    -f $result.Version                                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          'prerelease={0}' -f $result.IsPrerelease.ToString().ToLowerInvariant() | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Import the packaged module in Windows PowerShell 5.1
        shell: powershell
        run: |
          Import-Module -Name ./output/stage/MSAL.Essentials/MSAL.Essentials.psd1 -Force -ErrorAction Stop
          $expected = 'Connect-MsalEssentials', 'Disconnect-MsalEssentials', 'Get-MsalEssentialsToken'
          $actual   = @(Get-Command -Module MSAL.Essentials | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw ('The packaged module exports: {0}' -f ($actual -join ', '))
          }

      - name: Import the packaged module in PowerShell 7
        shell: pwsh
        run: |
          Import-Module -Name ./output/stage/MSAL.Essentials/MSAL.Essentials.psd1 -Force -ErrorAction Stop
          $expected = 'Connect-MsalEssentials', 'Disconnect-MsalEssentials', 'Get-MsalEssentialsToken'
          $actual   = @(Get-Command -Module MSAL.Essentials | Select-Object -ExpandProperty Name | Sort-Object)
          if (Compare-Object -ReferenceObject $expected -DifferenceObject $actual) {
            throw ('The packaged module exports: {0}' -f ($actual -join ', '))
          }

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: module-package
          path: |
            output/MSAL.Essentials-*.zip
            output/SHA256SUMS.txt
            output/release-notes.md
          if-no-files-found: error
          retention-days: 14

      # Lets anyone check that the zip was built by this workflow from this repository:
      #   gh attestation verify MSAL.Essentials-<version>.zip --repo Hitboo/MSAL.Essentials
      - name: Attest the build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: output/MSAL.Essentials-*.zip

  github-release:
    name: GitHub release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # the only job that can create a release

    steps:
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: module-package
          path: output

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" output/MSAL.Essentials-*.zip output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file output/release-notes.md \
            "${flags[@]}"
